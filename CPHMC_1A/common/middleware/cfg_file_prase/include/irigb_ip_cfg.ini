[IO_Slot_Cfg]
Plat_Type = CPHMC_1A ;平台类型
Dev_Type = SMT_MU ;控保主机
Cfg_Ver = V1.0.0.1 ;配置文件版本号
;irigb信息配置
[IRIGB_Cfg]
;1.对时方式：SNTP/1588/B码对时
Time_Mode = 1 ;1为IRIGB,2为SNTP,3为1588
;2.时区：以分钟为单位，表示东八区还是西八区
Time_Zone = 480 ;东八区 8 * 60
;3.B码校验方式：奇/偶校验/无校验
B_Code_Check = 0 ;0为无校验,1为奇校验,2为偶校验
;B码抖动阈值us
B_COde_Shake_us = 15
;B码极性取反标志 (0:不取反, 1:取反)
Polarity_Flag = 0
;SNTP对时服务器IP地址
SNTP_Server_IP = 192.168.17.100

;外网ip配置
[Port_IP_Cfg]
;软件上外网口最多4个槽位,一个槽位8个网口，目前硬件只有槽位3和槽位4有8个百兆网口，R0和R1两个核通外网

