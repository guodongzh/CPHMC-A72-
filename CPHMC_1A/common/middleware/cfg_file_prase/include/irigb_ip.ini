[IO_Slot_Cfg]
Plat_Type = CPHMC_1A ;平台类型
Dev_Type = HVDC ;控保主机
Cfg_Ver = V1.0.0.1 ;配置文件版本号
;对时参数配置
[Time_Param_Cfg]
;对时方式：0x01为IRIGB,0x2为SNTP,0x4为1588,0x03--IRIGB与SNTP冗余对时，0x05--IRIGB与1588冗余对时，0x07--3个冗余对时
Time_Mode = 1 
;时区：以分钟为单位，有符号数，表示东八区还是西八区
Time_Zone = 680
;B码校验方式：;0为无校验,1为奇校验,2为偶校验
B_Code_Check = 0 
;B码抖动us
B_Code_Shake_us =10
;B码极性取反标志：0为不取反，1为取反
B_Code_Polarity = 0
;SNTP对时服务端的IP地址
Sntp_Serve_IP =	192.168.17.100 

;装置地址配置
[Device_Addr_Cfg]
;装置地址设定
Dev_Addr = 10 ;区分不同装置

;设定需修改的端口单网ip，如为默认IP，则不用修改
[Port_IP_Cfg]
Set_IP_number=0			;设置IP个数
;外网口最多16个以太网端口，每个网口可配置4个单网ip地址，Core序号从1开始(对应R0-R3),Eth序号从1开始(对应外网口序号1-16)
;              Core号, Eth序号,      IP地址
Set_Eth_IP_1 = 	 1,      1,		     192.168.99.10
Set_Eth_IP_2 = 	 1,      2,		     192.158.99.10
Set_Eth_IP_3 = 	 1,      3,		     192.148.99.10
Set_Eth_IP_4 = 	 1,      4,		     192.138.99.10

[CheckCode]
CHECKSUM = 0xC3322388